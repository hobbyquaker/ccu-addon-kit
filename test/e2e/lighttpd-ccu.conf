# The parts of a CCU's lighttpd configuration an addon depends on: /addons/ from
# /usr/local/etc/config/addons/www, .cgi run by tclsh, the addons' own fragments.
server.modules = ("mod_alias", "mod_cgi", "mod_proxy")
server.document-root = "/www"
server.port = 80
server.pid-file = "/run/lighttpd.pid"
server.errorlog = "/var/log/lighttpd-error.log"
index-file.names = ("index.htm", "index.html", "index.cgi")
mimetype.assign = (".html" => "text/html", ".json" => "application/json", ".svg" => "image/svg+xml", ".js" => "text/javascript", ".css" => "text/css")
alias.url += ("/addons" => "/usr/local/etc/config/addons/www")
$HTTP["url"] =~ "^/addons/" {
    cgi.assign = (".cgi" => "/usr/bin/tclsh")
}
include "/usr/local/etc/config/lighttpd/*.conf"
