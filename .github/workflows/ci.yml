name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: lint and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/tcl/lint-tcl82.mjs
      - run: node --test 'test/cli/*.test.mjs'

  sh:
    name: shellcheck, busybox, kit-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f test/docker/tcl86.Dockerfile -t ccu-addon-kit-tcl86 test/
      - run: docker run --rm -v "$PWD:/kit" -w /kit ccu-addon-kit-tcl86 sh test/sh/run.sh

  tcl86:
    name: Tcl CGIs (Tcl 8.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f test/docker/tcl86.Dockerfile -t ccu-addon-kit-tcl86 test/
      - run: docker run --rm -v "$PWD:/kit" -w /kit ccu-addon-kit-tcl86 node --test 'test/tcl/*.test.mjs'

  tcl82:
    name: Tcl CGIs (Tcl 8.2.3, the CCU3 firmware's)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f test/docker/tcl82.Dockerfile -t ccu-addon-kit-tcl82 test/
      - run: docker run --rm -v "$PWD:/kit" -w /kit ccu-addon-kit-tcl82 node --test 'test/tcl/*.test.mjs'

  e2e:
    name: kitdemo end to end (install, check-rc, CGIs through lighttpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build -f test/e2e/Dockerfile -t ccu-addon-kit-e2e test/
      - run: node --test test/e2e/e2e.test.mjs
